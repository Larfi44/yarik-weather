<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yarik Weather</title>
    <meta name="description" content="Weather app with AI recommendations" />
    <!-- Weather data comes straight from Open-Meteo (src/js/api.js in the repo,
         js/api.js in a build) — no API key is needed. A paid key can be added
         per load with ?key=<key> or window.YW_API_KEY, or at runtime with
         YW.api.setApiKey('<key>'). -->
    <link rel="icon" href="src/assets/favicon.svg" />
    <link rel="stylesheet" href="src/main.css" />
    <!-- Theme boot: paint the saved theme before the first frame.
         app.js only runs once every deferred module has loaded, which is long
         enough for the page to paint light first and then flip to dark
         (~0.2 s flash). This tiny inline copy of the same rule — saved
         settings.theme, with prefers-color-scheme standing in for "auto" —
         sets the class on <html> while the document is still parsing, so the
         very first paint is already dark. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var raw = localStorage.getItem('weather_settings');
          var saved = 'auto';
          if (raw) {
            var parsed = JSON.parse(raw);
            saved = (parsed && parsed.theme) || 'auto';
          }
          var prefersDark = window.matchMedia
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : false;
          var dark = saved === 'dark' || (saved !== 'light' && prefersDark);
          theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* unreadable storage: keep the light default */
        }
        var root = document.documentElement;
        root.classList.add('theme-' + theme);
        // Native scrollbars / form controls should match, too.
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <!-- Static app shell. All dynamic parts (weather, status cards, modals)
         are rendered by the scripts below — see js/app.js for the entry point.
         The theme class lives on <html> (set above, then mirrored by
         app.js:applyTheme), so the shell carries no hard-coded theme. -->
    <div class="app-shell" id="app-shell">
      <div class="app-container">
        <div class="header glass-card">
          <div class="brand">
            <img
              src="src/assets/favicon.svg"
              class="header-icon"
              alt="Yarik Weather"
            />
            <h1>Yarik Weather</h1>
          </div>
          <div class="header-buttons">
            <button class="icon-btn" id="theme-btn" type="button">🌓</button>
            <button
              class="icon-btn"
              id="ai-btn"
              type="button"
              style="color: blue"
            >
              AI
            </button>
            <button class="icon-btn" id="downloads-btn" type="button">
              📥
            </button>
            <button class="icon-btn" id="settings-btn" type="button">⚙️</button>
          </div>
        </div>

        <div class="search-container">
          <input
            class="city-input"
            id="city-input"
            type="text"
            placeholder="Enter city name..."
          />
          <button class="search-btn" id="search-btn" type="button">
            Search
          </button>
        </div>

        <div id="status-slot"></div>
        <div id="weather-slot"></div>
        <div id="modal-slot"></div>
      </div>
    </div>

    <script src="src/js/settings.js" defer></script>
    <script src="src/js/helpers.js" defer></script>
    <script src="src/js/coastal.js" defer></script>
    <script src="src/js/api.js" defer></script>
    <script src="src/js/tauri.js" defer></script>
    <script src="src/js/dom.js" defer></script>
    <script src="src/js/weather.js" defer></script>
    <script src="src/js/modals.js" defer></script>
    <script src="src/js/ai.js" defer></script>
    <script src="src/js/app.js" defer></script>
  </body>
</html>
