<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yarik Weather</title>
    <meta name="description" content="Weather app with AI recommendations" />
    <!-- Weather data comes straight from api-ninjas (see js/api.js). The API
         key can be overridden per load with ?key=<key> or window.YW_API_KEY,
         or at runtime with YW.api.setApiKey('<key>'). -->
    <link rel="icon" href="src/assets/favicon.svg" />
    <link rel="stylesheet" href="src/main.css" />
  </head>
  <body>
    <!-- Static app shell. All dynamic parts (weather, status cards, modals)
         are rendered by the scripts below — see js/app.js for the entry point. -->
    <div class="app-shell theme-light" id="app-shell">
      <div class="app-container">
        <div class="header glass-card">
          <div class="brand">
            <img
              src="src/assets/favicon.svg"
              class="header-icon"
              alt="Yarik Weather"
            />
            <h1>Yarik Weather</h1>
          </div>
          <div class="header-buttons">
            <button class="icon-btn" id="theme-btn" type="button">🌓</button>
            <button
              class="icon-btn"
              id="ai-btn"
              type="button"
              style="color: blue"
            >
              AI
            </button>
            <button class="icon-btn" id="downloads-btn" type="button">
              📥
            </button>
            <button class="icon-btn" id="settings-btn" type="button">⚙️</button>
          </div>
        </div>

        <div class="search-container">
          <input
            class="city-input"
            id="city-input"
            type="text"
            placeholder="Enter city name..."
          />
          <button class="search-btn" id="search-btn" type="button">
            Search
          </button>
        </div>

        <div id="status-slot"></div>
        <div id="weather-slot"></div>
        <div id="modal-slot"></div>
      </div>
    </div>

    <script src="src/js/settings.js" defer></script>
    <script src="src/js/helpers.js" defer></script>
    <script src="src/js/coastal.js" defer></script>
    <script src="src/js/api.js" defer></script>
    <script src="src/js/tauri.js" defer></script>
    <script src="src/js/dom.js" defer></script>
    <script src="src/js/weather.js" defer></script>
    <script src="src/js/modals.js" defer></script>
    <script src="src/js/ai.js" defer></script>
    <script src="src/js/app.js" defer></script>
  </body>
</html>
