[package]
name = "frontend"
version = "0.1.0"
authors = ["Larfi44 <yaroslav.krasulya@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["web"] }
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
gloo-utils = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
chrono = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList", "MediaQueryListEvent"] }
js-sys = "0.3"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
