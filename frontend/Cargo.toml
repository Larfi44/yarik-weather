[package]
name = "frontend"
version = "0.1.0"
authors = ["Larfi44 <yaroslav.krasulya@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.4" }
dioxus-web = { version = "0.5.0", optional = true }
dioxus-desktop = { version = "0.7.1", optional = true }
reqwest = "0.13.2"
serde = "1.0.228"
urlencoding = "2.1.3"
serde_json = "1.0.149"
chrono = "0.4.44"
pollster = { version = "0.3.0", optional = true }
dirs = { version = "5.0.1", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo = "0.12.0"
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
web-sys = { version = "0.3.95", features = ["Window", "MediaQueryList", "MediaQueryListEvent"] }
wasm-bindgen = "0.2" 
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
gloo-utils = "0.3.0"

[features]
default = ["web"]
web = ["dioxus-web", "dioxus/web"]
desktop = ["dioxus-desktop", "dioxus/desktop", "pollster", "dirs"]
mobile = ["dioxus/mobile", "tracing", "tracing-subscriber"]
server = ["dioxus/server"]