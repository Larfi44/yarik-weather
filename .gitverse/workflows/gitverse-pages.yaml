name: Publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the api-ninjas client
        run: |
          if command -v node >/dev/null 2>&1; then
            node --version
            node frontend/scripts/test-api.js
          else
            echo "::warning::node is unavailable on this runner - skipping the client test"
          fi

      - name: Build static site
        run: bash frontend/scripts/build.sh

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v1.0.0
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v1.0.0
